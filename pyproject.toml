[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "e2x-hub-rbac"
dynamic = ["version"]
description = 'Role-Based Access Control (RBAC) for JupyterHub within the e2x ecosystem, supporting hierarchical scopes (Hub, Course, Term) based on JupyterHub groups.'
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = []
authors = [
  { name = "Tim Metzler", email = "tim.metzler@h-brs.de" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "pydantic>=2.0",
  "httpx>=0.24",
]

[project.urls]
Documentation = "https://github.com/Digiklausur/e2x-hub-rbac#readme"
Issues = "https://github.com/Digiklausur/e2x-hub-rbac/issues"
Source = "https://github.com/Digiklausur/e2x-hub-rbac"

[project.optional-dependencies]
dev = [
  "pre-commit",
  "ruff",
  "tbump",
  "build",
  "twine",
]
test = [
  "pytest",
  "pytest-cov",
  "pytest-asyncio",
]
docs = [
  "sphinx",
  "pydata-sphinx-theme",
]

[tool.hatch.version]
path = "e2x_hub_rbac/__about__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.tbump]
github_url = "https://github.com/Digiklausur/e2x-hub-rbac"

[tool.tbump.version]
current = "0.1.0"
regex = '''
  (?P<major>\d+)
  \.
  (?P<minor>\d+)
  \.
  (?P<patch>\d+)
  (?P<rc>rc\d+)?
  '''

[tool.tbump.git]
message_template = "Bump to {new_version}"
tag_template = "v{new_version}"

# Files with the version to update
[[tool.tbump.file]]
src = "e2x_hub_rbac/__about__.py"

[[tool.tbump.before_commit]]
name = "Build"
cmd = "python -m build"

[[tool.tbump.before_commit]]
name = "Check with twine"
cmd = "twine check dist/*"

[tool.ruff]
line-length = 100
lint.select = ["F", "E", "I"]
